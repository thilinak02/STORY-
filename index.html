<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STORY PRO - Master Edition</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --viber: #7360f2; --glass: rgba(0, 0, 0, 0.75); }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #000; color: white; min-height: 100vh; }
        .hidden { display: none !important; }
        header { background: var(--viber); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; }
        .card { background: var(--glass); padding: 15px; margin: 10px; border-radius: 15px; border: 1px solid #333; }
        input, button { border-radius: 12px; border: 1px solid #444; padding: 12px; margin: 5px 0; width: 100%; box-sizing: border-box; background: #111; color: white; }
        #story-detail-window { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: flex; flex-direction: column; overflow-y: auto; }
        .story-img { width: 100%; border-radius: 10px; margin-top: 10px; display: block; max-height: 300px; object-fit: cover; }
    </style>
</head>
<body>

    <!-- කතාව පෙන්වන Window එක -->
    <div id="story-detail-window" class="hidden">
        <header>
            <span id="detail-author">Story Detail</span>
            <button class="fr-btn" style="width:auto;" onclick="document.getElementById('story-detail-window').classList.add('hidden')">Close</button>
        </header>
        <div id="detail-container" class="page" style="padding: 10px;"></div>
    </div>

    <script>
        // මෙතැනට ඔබේ Firebase Config සහ අනෙකුත් functions එකතු කරන්න

        function viewFullStory(key) {
            const s = fullStoriesObjects[key];
            if(!s) return;
            const likesCount = s.likes ? Object.keys(s.likes).length : 0;
            const hasLiked = s.likes && s.likes[myId];
            
            document.getElementById('detail-author').innerText = s.user + "'s Story";
            const container = document.getElementById('detail-container');
            
            container.innerHTML = `
                <div class="card" style="background:transparent; border:none;">
                    <h2>${s.user}</h2>
                    <div style="white-space: pre-wrap; font-size:16px;">${formatText(s.text)}</div>
                    ${s.img ? `<img src="${s.img}" class="story-img">` : ''}
                    
                    <div style="margin-top:20px; display:flex; align-items:center; gap:10px;">
                        <button onclick="toggleLike('${key}')" style="background:${hasLiked ? '#e74c3c' : '#333'}; width:auto; padding:8px 15px;">
                            ${hasLiked ? '❤️ Liked' : '🤍 Like'}
                        </button>
                        <span>${likesCount} Likes</span>
                    </div>

                    <div style="margin-top:20px;">
                        <h4>Comments</h4>
                        <div id="comment-list" style="margin-bottom:10px; max-height:200px; overflow-y:auto;"></div>
                        <input id="comm-input" placeholder="Write a comment...">
                        <button onclick="postComment('${key}')" style="background:var(--viber);">Post Comment</button>
                    </div>
                </div>
            `;
            loadComments(key);
            document.getElementById('story-detail-window').classList.remove('hidden');
        }

        function toggleLike(key) {
            const likeRef = db.ref('stories/' + key + '/likes/' + myId);
            likeRef.once('value', snap => {
                if (snap.exists()) { likeRef.remove(); } else { likeRef.set(true); }
                viewFullStory(key);
            });
        }

        function postComment(key) {
            const msg = document.getElementById('comm-input').value.trim();
            if (!msg) return;
            db.ref('stories/' + key + '/comments').push({ user: myNm, text: msg, time: Date.now() }).then(() => {
                document.getElementById('comm-input').value = "";
            });
        }

        function loadComments(key) {
            db.ref('stories/' + key + '/comments').on('value', snap => {
                const list = document.getElementById('comment-list');
                list.innerHTML = "";
                snap.forEach(c => {
                    list.innerHTML += `<div style="font-size:12px; background:#222; padding:8px; border-radius:5px; margin-bottom:5px;">
                        <b>${c.val().user}:</b> ${c.val().text}
                    </div>`;
                });
            });
        }
    </script>
</body>
</html>
