<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STORY PRO - Master Edition</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --viber: #7360f2; --glass: rgba(0, 0, 0, 0.75); }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #000; color: white; min-height: 100vh; }
        .card { background: rgba(255,255,255,0.1); padding: 15px; margin: 10px; border-radius: 15px; }
        .hidden { display: none !important; }
        button { padding: 8px 15px; border-radius: 10px; border: none; cursor: pointer; color: white; }
    </style>
</head>
<body>

<div id="story-detail-window" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; padding:20px;">
    <span onclick="closeStoryDetail()" style="cursor:pointer;">⬅ Back</span>
    <div id="detail-container"></div>
</div>

<script>
    // Firebase Config එලෙසම ඇත
    // ... (ඔබේ කලින් තිබූ Firebase Config සහ අනෙක් functions)

    function viewFullStory(key) {
        const s = fullStoriesObjects[key];
        if (!s) return;
        
        const hasLiked = s.likes && s.likes[myId];

        document.getElementById('detail-container').innerHTML = `
            <div class="card">
                <h2>${s.user}</h2>
                <div style="white-space: pre-wrap;">${formatText(s.text)}</div>
                ${s.img ? `<img src="${s.img}" style="width:100%;">` : ''}
                
                <div style="margin-top:15px;">
                    <button onclick="toggleLike('${key}')" style="background:${hasLiked ? '#e74c3c' : '#333'};">
                        ${hasLiked ? '❤️ Liked' : '🤍 Like'}
                    </button>
                </div>

                <div style="margin-top:20px;">
                    <h4>Comments</h4>
                    <div id="comment-list" style="margin-bottom:10px;"></div>
                    <input id="comm-input" style="color:black;" placeholder="Write a comment...">
                    <button onclick="postComment('${key}')" style="background:var(--viber);">Post</button>
                </div>
            </div>
        `;
        loadComments(key);
        document.getElementById('story-detail-window').classList.remove('hidden');
    }

    function toggleLike(key) {
        const likeRef = db.ref('stories/' + key + '/likes/' + myId);
        likeRef.once('value', snap => {
            if (snap.exists()) {
                likeRef.remove();
            } else {
                likeRef.set(true);
            }
            // Like කළ පසු නැවත View එක Refresh කරන්න
            viewFullStory(key);
        });
    }

    function postComment(key) {
        const msg = document.getElementById('comm-input').value.trim();
        if (!msg) return;
        db.ref('stories/' + key + '/comments').push({
            user: myNm,
            text: msg,
            time: Date.now()
        }).then(() => {
            document.getElementById('comm-input').value = "";
        });
    }

    function loadComments(key) {
        db.ref('stories/' + key + '/comments').on('value', snap => {
            const list = document.getElementById('comment-list');
            list.innerHTML = "";
            snap.forEach(c => {
                list.innerHTML += `<div style="font-size:12px; background:#222; padding:5px; margin-bottom:5px;">
                    <b>${c.val().user}:</b> ${c.val().text}
                </div>`;
            });
        });
    }

    function closeStoryDetail() { 
        document.getElementById('story-detail-window').classList.add('hidden'); 
    }
</script>

</body>
</html>
