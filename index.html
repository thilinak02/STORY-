<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STORY PRO - Master Edition</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --viber: #7360f2; --glass: rgba(0, 0, 0, 0.75); }
        body { font-family: sans-serif; margin: 0; background: #000; color: white; min-height: 100vh; }
        .hidden { display: none !important; }
        .page { padding-bottom: 90px; }
        .card { background: var(--glass); padding: 15px; margin: 10px; border-radius: 15px; border: 1px solid #333; cursor: pointer; }
        .p-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        header { background: var(--viber); padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; }
        .nav-bar { background: #000; display: flex; height: 70px; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #333; }
        .nav-item { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        input, button { padding: 12px; width: 100%; margin: 5px 0; border-radius: 10px; border: 1px solid #444; background: #111; color: white; }
    </style>
</head>
<body>

<div id="auth-page" style="padding:40px;">
    <div class="card">
        <h2 style="text-align:center;">STORY PRO</h2>
        <input id="login-email" type="email" placeholder="Email">
        <input id="login-pwd" type="password" placeholder="Password">
        <button onclick="loginWithEmailPwd()" style="background:var(--viber);">LOGIN</button>
    </div>
</div>

<div id="main-app" class="hidden">
    <header>
        <b id="myn">Story Pro</b>
        <button onclick="logout()" style="width:auto; padding:5px 10px;">Logout</button>
    </header>

    <div id="p-chats" class="page">
        <div id="cons"></div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="pg('p-chats',this)">💬 Chats</div>
    </div>
</div>

<div id="chat-window" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:200;">
    <header><span onclick="closeChat()" style="cursor:pointer;">⬅ Back</span> <b id="chat-name"></b></header>
    <div id="msg-container" style="flex:1; overflow-y:auto; padding:15px; height: 70vh;"></div>
    <div style="padding:10px; display:flex;">
        <input id="msg-input" placeholder="Type message...">
        <button onclick="sendMsg()" style="width:auto;">Send</button>
    </div>
</div>

<script>
    const firebaseConfig = { /* ඔබේ config මෙතනට දාන්න */ };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    
    let myId = localStorage.getItem("myId") || "";
    let activeChatPh = "";
    let currentChatListener = null;

    function loginWithEmailPwd() {
        const email = document.getElementById('login-email').value.trim().toLowerCase();
        const pwd = document.getElementById('login-pwd').value.trim();
        auth.signInWithEmailAndPassword(email, pwd).then(() => {
            localStorage.setItem("myId", btoa(email).replace(/=/g, ""));
            location.reload();
        }).catch(err => alert(err.message));
    }

    function loadFriends() {
        db.ref('friends/'+myId).on('value', snap => {
            const c = document.getElementById('cons');
            c.innerHTML = ""; // ඩබල් වෙන එක වැළැක්වීමට
            snap.forEach(f => {
                if(f.val().status === 'accepted') {
                    db.ref('users/'+f.key).once('value', u => {
                        const uData = u.val();
                        c.insertAdjacentHTML('beforeend', `
                            <div class="card" onclick="openChat('${f.key}','${uData.name}')">
                                <b>${uData.name}</b>
                            </div>
                        `);
                    });
                }
            });
        });
    }

    function openChat(targetId, name) {
        activeChatPh = targetId;
        document.getElementById('chat-name').innerText = name;
        document.getElementById('chat-window').classList.remove('hidden');
        
        // පැරණි listener එක ඉවත් කරන්න
        if(currentChatListener) db.ref('messages/'+(myId < activeChatPh ? myId+"_"+activeChatPh : activeChatPh+"_"+myId)).off('value', currentChatListener);
        
        const cid = myId < targetId ? myId+"_"+targetId : targetId+"_"+myId;
        currentChatListener = db.ref('messages/'+cid).on('value', s => {
            const mc = document.getElementById('msg-container');
            mc.innerHTML = ""; // චැට් පණිවිඩ දෙපාර එන එක නවත්වයි
            s.forEach(m => {
                mc.innerHTML += `<div style="margin:5px; padding:10px; background:${m.val().sender===myId ? '#7360f2' : '#333'}; border-radius:10px;">${m.val().msg}</div>`;
            });
        });
    }

    function sendMsg() {
        const msg = document.getElementById('msg-input').value.trim();
        if(!msg) return;
        const cid = myId < activeChatPh ? myId+"_"+activeChatPh : activeChatPh+"_"+myId;
        db.ref('messages/'+cid).push({ sender: myId, msg: msg, time: Date.now() });
        document.getElementById('msg-input').value = "";
    }

    function closeChat() {
        if(currentChatListener) {
            const cid = myId < activeChatPh ? myId+"_"+activeChatPh : activeChatPh+"_"+myId;
            db.ref('messages/'+cid).off('value', currentChatListener);
            currentChatListener = null;
        }
        document.getElementById('chat-window').classList.add('hidden');
    }

    function logout() { auth.signOut(); localStorage.clear(); location.reload(); }
    auth.onAuthStateChanged(user => { if(user) { document.getElementById('auth-page').classList.add('hidden'); document.getElementById('main-app').classList.remove('hidden'); loadFriends(); } });
</script>
</body>
</html>
